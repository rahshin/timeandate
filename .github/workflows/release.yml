name: Release

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Build a candidate, promote a QA candidate, or restore a stable release
        type: choice
        options: [candidate, promote, rollback]
        required: true
      tag:
        description: Optional for candidate. Use an existing RC tag for promote or a stable tag for rollback.
        type: string
      source_sha:
        description: Optional full source SHA for candidate. Blank uses main at dispatch.
        type: string

permissions:
  contents: read

concurrency:
  group: timeandate-release
  cancel-in-progress: false

jobs:
  plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      source: ${{ steps.plan.outputs.source }}
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Verify release selection
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          OPERATION: ${{ inputs.operation }}
          TAG: ${{ inputs.tag }}
          SOURCE: ${{ inputs.source_sha }}
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          if [ "$OPERATION" = candidate ]; then
            SOURCE=${SOURCE:-$DISPATCH_SHA}
            TAG=$(node scripts/release.mjs resolve-candidate "$OPERATION" "$TAG" "$SOURCE")
            if ! git branch -r --contains "$SOURCE" | grep -Eq '^ +origin/(main|release/[0-9]+\.[0-9]+)$'; then
              echo "Commit $SOURCE was not found on main or a release/<major>.<minor> branch. Check the SHA and push or merge that commit before retrying." >&2
              exit 1
            fi
            if ! gh run list --workflow ci.yml --event push --commit "$SOURCE" --status success --json headSha \
              --jq '.[].headSha' | grep -Fx "$SOURCE" >/dev/null; then
              echo "Could not confirm a successful CI push run for $SOURCE. Check Actions → CI and retry after that commit passes." >&2
              exit 1
            fi
            if git show-ref --verify --quiet "refs/tags/$TAG"; then
              echo "Candidate tag $TAG already exists. To build a new candidate, use the next unused RC number." >&2
              exit 1
            fi
          else
            node scripts/release.mjs validate "$OPERATION" "$TAG" "$SOURCE"
            if ! KIND=$(gh release view "$TAG" --json isDraft,isPrerelease --jq '[.isDraft,.isPrerelease] | join(" ")'); then
              echo "Could not load the release for $TAG. Check that it exists under Releases and is accessible, then retry." >&2
              exit 1
            fi
            if [ "$OPERATION" = promote ]; then
              if [ "$KIND" != 'false true' ]; then
                echo "Release $TAG cannot be promoted. Select a published QA prerelease." >&2
                exit 1
              fi
              STABLE=${TAG%-rc.*}
              if git show-ref --verify --quiet "refs/tags/$STABLE"; then
                echo "Stable tag $STABLE already exists. Choose a candidate for a new stable version, or use rollback to restore a published stable release." >&2
                exit 1
              fi
            else
              if [ "$KIND" != 'false false' ]; then
                echo "Release $TAG cannot be rolled back to. Select a published stable release." >&2
                exit 1
              fi
            fi
            if ! SOURCE=$(git rev-parse --verify "refs/tags/$TAG^{commit}"); then
              echo "Release $TAG has no matching Git tag in this checkout. Check the tag in GitHub before retrying." >&2
              exit 1
            fi
          fi
          printf 'source=%s\ntag=%s\n' "$SOURCE" "$TAG" >> "$GITHUB_OUTPUT"
          printf '### Release plan\n\nOperation: %s\n\nTag: %s\n\nSource: %s\n' "$OPERATION" "$TAG" "$SOURCE" >> "$GITHUB_STEP_SUMMARY"
      - name: Verify published bundle and show digest for approval
        if: inputs.operation != 'candidate'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.plan.outputs.tag }}
          QA_URL: ${{ vars.QA_URL }}
        run: |
          if ! gh release download "$TAG" -D artifacts -p bundle.tar.gz -p SHA256SUMS; then
            echo "Could not download the bundle for $TAG. Open the GitHub release and check that bundle.tar.gz and SHA256SUMS are attached." >&2
            exit 1
          fi
          if ! (cd artifacts && sha256sum --check SHA256SUMS); then
            echo 'Could not verify the release bundle. Check the checksum output above and use the original bundle.tar.gz and its matching SHA256SUMS.' >&2
            exit 1
          fi
          {
            printf '\nBundle digest\n\n```text\n'
            cat artifacts/SHA256SUMS
            printf '```\n\nQA: %s\n' "$QA_URL"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: inputs.operation != 'candidate'
        with:
          name: verified-bundle
          path: artifacts/
          if-no-files-found: error

  build:
    if: inputs.operation == 'candidate'
    needs: plan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.source }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Stamp and package the web output
        env:
          TAG: ${{ needs.plan.outputs.tag }}
          SOURCE: ${{ needs.plan.outputs.source }}
        run: |
          node scripts/release.mjs stamp candidate "$TAG" "$SOURCE"
          mkdir artifacts
          tar -czf artifacts/bundle.tar.gz -C dist .
          (cd artifacts && sha256sum bundle.tar.gz > SHA256SUMS)
      - uses: actions/upload-artifact@v7
        with:
          name: verified-bundle
          path: artifacts/
          if-no-files-found: error

  qa:
    if: inputs.operation == 'candidate'
    needs: [plan, build]
    runs-on: ubuntu-24.04
    environment:
      name: qa
      url: ${{ vars.DEPLOY_URL }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v7
        with:
          name: verified-bundle
          path: artifacts
      - name: Deploy and verify QA
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          DEPLOY_URL: ${{ vars.DEPLOY_URL }}
        run: |
          node scripts/release.mjs check-deploy
          if ! (cd artifacts && sha256sum --check SHA256SUMS); then
            echo 'Could not verify the release bundle. Check the checksum output above and use the original bundle.tar.gz and its matching SHA256SUMS.' >&2
            exit 1
          fi
          mkdir dist
          if ! tar -xzf artifacts/bundle.tar.gz -C dist; then
            echo 'Could not unpack bundle.tar.gz. Check the selected release artifact before retrying.' >&2
            exit 1
          fi
          if ! npx --no-install wrangler deploy --env qa; then
            echo 'Could not deploy to qa on Cloudflare. See the Wrangler output above and check the target account, token permissions, and Worker settings before retrying.' >&2
            exit 1
          fi
          node scripts/release.mjs smoke "$DEPLOY_URL"

  publish-candidate:
    if: inputs.operation == 'candidate'
    needs: [plan, qa]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: verified-bundle
          path: artifacts
      - name: Publish QA-verified candidate
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.plan.outputs.tag }}
          SOURCE: ${{ needs.plan.outputs.source }}
        run: |
          if ! (cd artifacts && sha256sum --check SHA256SUMS); then
            echo 'Could not verify the release bundle. Check the checksum output above and use the original bundle.tar.gz and its matching SHA256SUMS.' >&2
            exit 1
          fi
          if ! gh release create "$TAG" artifacts/* --repo "$REPO" --target "$SOURCE" --prerelease \
            --title "$TAG" --notes "QA smoke tests passed for commit $SOURCE."; then
            echo "QA passed, but GitHub could not publish $TAG. Check the output above, tag rules, and whether the release or its assets already exist before retrying." >&2
            exit 1
          fi

  production:
    if: inputs.operation != 'candidate'
    needs: plan
    runs-on: ubuntu-24.04
    environment:
      name: production
      url: ${{ vars.DEPLOY_URL }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v7
        with:
          name: verified-bundle
          path: artifacts
      - name: Deploy approved bundle and verify production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          DEPLOY_URL: ${{ vars.DEPLOY_URL }}
        run: |
          node scripts/release.mjs check-deploy
          if ! (cd artifacts && sha256sum --check SHA256SUMS); then
            echo 'Could not verify the release bundle. Check the checksum output above and use the original bundle.tar.gz and its matching SHA256SUMS.' >&2
            exit 1
          fi
          mkdir dist
          if ! tar -xzf artifacts/bundle.tar.gz -C dist; then
            echo 'Could not unpack bundle.tar.gz. Check the selected release artifact before retrying.' >&2
            exit 1
          fi
          if ! npx --no-install wrangler deploy --env=""; then
            echo 'Could not deploy to production on Cloudflare. See the Wrangler output above and check the target account, token permissions, and Worker settings before retrying.' >&2
            exit 1
          fi
          node scripts/release.mjs smoke "$DEPLOY_URL"

  publish-stable:
    if: inputs.operation == 'promote'
    needs: [plan, production]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: verified-bundle
          path: artifacts
      - name: Publish the deployed bundle
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.plan.outputs.tag }}
          SOURCE: ${{ needs.plan.outputs.source }}
        run: |
          if ! (cd artifacts && sha256sum --check SHA256SUMS); then
            echo 'Could not verify the release bundle. Check the checksum output above and use the original bundle.tar.gz and its matching SHA256SUMS.' >&2
            exit 1
          fi
          STABLE=${TAG%-rc.*}
          if ! gh release create "$STABLE" artifacts/* --repo "$REPO" --target "$SOURCE" \
            --title "$STABLE" --notes "Promoted $TAG after production smoke tests. Source: $SOURCE."; then
            echo "Production was deployed and verified, but GitHub could not finish publishing $STABLE. Check the release, its assets, and tag rules before retrying publication." >&2
            exit 1
          fi
