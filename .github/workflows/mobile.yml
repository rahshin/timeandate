name: Build mobile apps

on:
  pull_request:
  push:
    branches: [main, 'release/**']
  workflow_dispatch:
    inputs:
      target:
        description: App to package for Android debug and iOS Release Simulator QA
        type: choice
        options: [timeandate, timers-dev]
        default: timeandate
        required: true

permissions:
  contents: read

jobs:
  android:
    strategy:
      fail-fast: false
      matrix:
        target: ${{ github.event_name == 'workflow_dispatch' && fromJSON(format('["{0}"]', inputs.target)) || fromJSON('["timeandate", "timers-dev"]') }}
    env:
      NATIVE_ROOT: ${{ matrix.target == 'timers-dev' && 'artifacts/timer-dev' || '.' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      # The Ubuntu 24.04 runner includes Android SDK Platform 36.
      - run: npm ci
      - run: npm test
      - if: matrix.target == 'timeandate'
        run: npm run mobile:sync -- android
      - if: matrix.target == 'timers-dev'
        run: npm run timer-dev:sync
      - run: sh ./gradlew :app:assembleDebug
        working-directory: ${{ env.NATIVE_ROOT }}/android
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}-android-debug
          path: ${{ env.NATIVE_ROOT }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
  ios:
    strategy:
      fail-fast: false
      matrix:
        target: ${{ github.event_name == 'workflow_dispatch' && fromJSON(format('["{0}"]', inputs.target)) || fromJSON('["timeandate", "timers-dev"]') }}
    env:
      NATIVE_ROOT: ${{ matrix.target == 'timers-dev' && 'artifacts/timer-dev' || '.' }}
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - if: matrix.target == 'timeandate'
        run: npm run mobile:sync -- ios
      - if: matrix.target == 'timers-dev'
        run: npm run timer-dev:sync
      - name: Build for iOS Simulator
        run: |
          xcodebuild -project "$NATIVE_ROOT/ios/App/App.xcodeproj" -scheme App -sdk iphonesimulator \
            -configuration Release -derivedDataPath ios-build CODE_SIGNING_ALLOWED=NO build
          ditto -c -k --keepParent ios-build/Build/Products/Release-iphonesimulator/App.app ios-simulator-release.zip
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}-ios-simulator-release
          path: ios-simulator-release.zip
          if-no-files-found: error
