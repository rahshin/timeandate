name: Build mobile apps

on:
  workflow_dispatch:
    inputs:
      target:
        description: App to package for debug QA
        type: choice
        options: [timeandate, timers-dev]
        default: timeandate
        required: true

permissions:
  contents: read

env:
  NATIVE_ROOT: ${{ inputs.target == 'timers-dev' && 'artifacts/timer-dev' || '.' }}

jobs:
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-36'
      - run: npm ci
      - run: npm test
      - if: inputs.target == 'timeandate'
        run: npm run mobile:sync -- android
      - if: inputs.target == 'timers-dev'
        run: npm run timer-dev:sync
      - run: ./gradlew assembleDebug
        working-directory: ${{ env.NATIVE_ROOT }}/android
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.target }}-android-debug
          path: ${{ env.NATIVE_ROOT }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
  ios:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - if: inputs.target == 'timeandate'
        run: npm run mobile:sync -- ios
      - if: inputs.target == 'timers-dev'
        run: npm run timer-dev:sync
      - name: Build for iOS Simulator
        run: |
          xcodebuild -project "$NATIVE_ROOT/ios/App/App.xcodeproj" -scheme App -sdk iphonesimulator \
            -configuration Debug -derivedDataPath ios-build CODE_SIGNING_ALLOWED=NO build
          ditto -c -k --keepParent ios-build/Build/Products/Debug-iphonesimulator/App.app timeandate-ios-simulator.zip
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.target }}-ios-simulator
          path: timeandate-ios-simulator.zip
          if-no-files-found: error
