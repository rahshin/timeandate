name: Build signed mobile apps

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Signing environment
        type: choice
        options: [mobile-qa, mobile-production]
        default: mobile-qa
        required: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Validate the selected ref
        env:
          BUILD_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          if [[ "$BUILD_ENVIRONMENT" == mobile-production && "$GITHUB_REF" != refs/heads/main && "$GITHUB_REF" != refs/heads/release/* ]]; then
            echo "::error::Select main or a release branch for a production mobile build."
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test

  android:
    needs: verify
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      # The Ubuntu 24.04 runner includes Android SDK Platform 36.
      - run: npm ci
      - run: npm run mobile:sync -- android
      - run: ./gradlew :app:bundleRelease
        working-directory: android
      - name: Sign and verify the Android App Bundle
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ vars.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          : "${ANDROID_KEYSTORE_BASE64:?Set the ANDROID_KEYSTORE_BASE64 environment secret}"
          : "${ANDROID_KEYSTORE_PASSWORD:?Set the ANDROID_KEYSTORE_PASSWORD environment secret}"
          : "${ANDROID_KEY_ALIAS:?Set the ANDROID_KEY_ALIAS environment variable}"
          : "${ANDROID_KEY_PASSWORD:?Set the ANDROID_KEY_PASSWORD environment secret}"

          umask 077
          keystore="$RUNNER_TEMP/android-upload.keystore"
          trap 'rm -f "$keystore"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          mkdir -p artifacts/mobile-release
          bundle=artifacts/mobile-release/timeandate-android.aab
          jarsigner -keystore "$keystore" -storepass:env ANDROID_KEYSTORE_PASSWORD \
            -keypass:env ANDROID_KEY_PASSWORD -signedjar "$bundle" \
            android/app/build/outputs/bundle/release/app-release.aab "$ANDROID_KEY_ALIAS"
          jarsigner -verify -keystore "$keystore" -storepass:env ANDROID_KEYSTORE_PASSWORD \
            "$bundle" "$ANDROID_KEY_ALIAS"
      - uses: actions/upload-artifact@v7
        with:
          name: timeandate-android-${{ inputs.environment }}-${{ github.sha }}
          path: artifacts/mobile-release/timeandate-android.aab
          if-no-files-found: error

  ios:
    needs: verify
    runs-on: macos-26
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run mobile:sync -- ios
      - name: Import signing identity and export IPA
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          IOS_TEAM_ID: ${{ vars.IOS_TEAM_ID }}
        run: |
          : "${IOS_CERTIFICATE_BASE64:?Set the IOS_CERTIFICATE_BASE64 environment secret}"
          : "${IOS_CERTIFICATE_PASSWORD:?Set the IOS_CERTIFICATE_PASSWORD environment secret}"
          : "${IOS_PROVISIONING_PROFILE_BASE64:?Set the IOS_PROVISIONING_PROFILE_BASE64 environment secret}"
          : "${IOS_TEAM_ID:?Set the IOS_TEAM_ID environment variable}"

          umask 077
          signing_dir=$(mktemp -d "$RUNNER_TEMP/ios-signing.XXXXXX")
          keychain="$signing_dir/signing.keychain-db"
          installed_profile=""
          cleanup() {
            security delete-keychain "$keychain" >/dev/null 2>&1 || true
            if [[ -n "$installed_profile" ]]; then rm -f "$installed_profile"; fi
            rm -rf "$signing_dir"
          }
          trap cleanup EXIT
          printf '%s' "$IOS_CERTIFICATE_BASE64" | base64 -D > "$signing_dir/certificate.p12"
          printf '%s' "$IOS_PROVISIONING_PROFILE_BASE64" | base64 -D > "$signing_dir/profile.mobileprovision"
          security cms -D -i "$signing_dir/profile.mobileprovision" > "$signing_dir/profile.plist"
          profile_uuid=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$signing_dir/profile.plist")
          profile_team=$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$signing_dir/profile.plist")
          profile_app=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$signing_dir/profile.plist")
          app_id=$(node -p 'require("./capacitor.config.json").appId')
          if [[ "$profile_team" != "$IOS_TEAM_ID" || "${profile_app#*.}" != "$app_id" ]]; then
            echo "::error::The provisioning profile must belong to IOS_TEAM_ID and match the app bundle identifier."
            exit 1
          fi

          keychain_password=$(openssl rand -hex 32)
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$signing_dir/certificate.p12" -P "$IOS_CERTIFICATE_PASSWORD" -k "$keychain" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain"
          profile_dir="$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          mkdir -p "$profile_dir"
          installed_profile="$profile_dir/$profile_uuid.mobileprovision"
          cp "$signing_dir/profile.mobileprovision" "$installed_profile"

          archive="$RUNNER_TEMP/Time And Date.xcarchive"
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$archive" \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY='Apple Distribution' \
            DEVELOPMENT_TEAM="$IOS_TEAM_ID" PROVISIONING_PROFILE_SPECIFIER="$profile_uuid" archive

          export_options="$signing_dir/export.plist"
          python3 - "$export_options" "$IOS_TEAM_ID" "$app_id" "$profile_uuid" <<'PY'
          import plistlib
          import sys

          output, team, app, profile = sys.argv[1:]
          with open(output, "wb") as stream:
              plistlib.dump({
                  "method": "app-store-connect",
                  "destination": "export",
                  "teamID": team,
                  "signingStyle": "manual",
                  "signingCertificate": "Apple Distribution",
                  "provisioningProfiles": {app: profile},
                  "manageAppVersionAndBuildNumber": False,
              }, stream)
          PY
          xcodebuild -exportArchive -archivePath "$archive" -exportOptionsPlist "$export_options" \
            -exportPath artifacts/mobile-release
      - uses: actions/upload-artifact@v7
        with:
          name: timeandate-ios-${{ inputs.environment }}-${{ github.sha }}
          path: artifacts/mobile-release/*.ipa
          if-no-files-found: error
