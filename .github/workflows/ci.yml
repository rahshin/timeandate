name: CI

on:
  pull_request:
  push:
    branches: [main, 'release/**']

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Lint GitHub Actions
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run mobile:build
